[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send the default Netlify subdomain to the custom domain so search engines
# only index one copy. Matches only the production netlify.app host, so
# deploy previews and branch deploys (deploy-preview-N--septicaudit.netlify.app)
# are unaffected.
[[redirects]]
  from = "https://septicaudit.netlify.app/*"
  to = "https://septicaudit.com/:splat"
  status = 301
  force = true
